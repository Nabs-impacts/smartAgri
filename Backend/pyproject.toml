[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartagri-api"
version = "0.1.0"
description = "SmartAgri Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "geoalchemy2>=0.15.0",
    "pgvector>=0.3.5",
    "shapely>=2.0.6",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "aioboto3>=13.2.0",
    "boto3>=1.35.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "pillow>=10.4.0",
    "numpy>=2.1.0",
    "pypdf>=5.0.0",
    "sentry-sdk>=2.15.0",
    "alembic>=1.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"app/db/models/__init__.py" = ["F401"]
"tests/conftest.py" = ["E402", "I001"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
